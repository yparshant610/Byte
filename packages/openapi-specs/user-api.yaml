openapi: 3.0.3
info:
  title: Food Byte - User Backend API Specification
  description: Contract-first OpenAPI specification for the Food Byte consumer client application.
  version: 1.0.0
servers:
  - url: http://localhost:4000/api/v1
    description: Local Development User Service
paths:
  # ==========================================
  # AUTHENTICATION (PUBLIC)
  # ==========================================
  /auth/signup:
    post:
      summary: Request OTP for initial consumer signup
      description: Initiates registration sequence by dispatching a verification OTP via NodeMailer. Enforces Token Bucket rate limiting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: consumer@foodbytes.app
      responses:
        '200':
          description: OTP dispatched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Verification OTP sent to your email." }
        '429':
          description: Rate limit exceeded (Token bucket full)

  /auth/verify-otp:
    post:
      summary: Verify OTP and create password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, password]
              properties:
                email: { type: string, format: email }
                otp: { type: string, example: "492018" }
                password: { type: string, minLength: 8, example: "SecurePass@2026" }
      responses:
        '201':
          description: User registered successfully, returns JWT Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/signin:
    post:
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid email or password

  /auth/logout:
    post:
      summary: Logout and blacklist JWT session in Redis
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session invalidated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Successfully logged out. Session token has been invalidated." }

  # ==========================================
  # USER PROFILE & PERMISSIONS
  # ==========================================
  /user/location:
    post:
      summary: Update consumer live GPS coordinates
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number, example: 12.9716 }
                longitude: { type: number, example: 77.5946 }
      responses:
        '200':
          description: Coordinates updated successfully

  # ==========================================
  # RESTAURANT DISCOVERY (<= 10 KM)
  # ==========================================
  /restaurants/nearby:
    get:
      summary: Discover nearby restaurants within constant 10 km radius
      description: "Queries Redis Geospatial index (restaurants:geo) and caches metadata for sub-millisecond retrieval. Clamped to maximum 10 km radius."
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, example: 12.9716 }
        - name: lng
          in: query
          required: true
          schema: { type: number, example: 77.5946 }
        - name: radiusKm
          in: query
          required: false
          schema: { type: number, default: 10, maximum: 10 }
      responses:
        '200':
          description: List of nearby restaurants sorted by distance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NearbyRestaurant'

  /restaurants/geo-index:
    post:
      summary: Admin/Merchant sync to index or invalidate restaurant in Redis Geospatial engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [restaurantId]
              properties:
                restaurantId: { type: string }
                name: { type: string }
                lat: { type: number }
                lng: { type: number }
                operationalStatus: { type: string, enum: [ACTIVE, INACTIVE, SUSPENDED, PENDING_APPROVAL] }
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  action: { type: string, example: "INDEXED_IN_REDIS" }

  # ==========================================
  # REDIS SHOPPING CART
  # ==========================================
  /cart:
    get:
      summary: Fetch consumer active shopping cart
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active shopping cart details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
    delete:
      summary: Clear entire shopping cart
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cart cleared successfully

  /cart/items:
    post:
      summary: Add line item with customization options to Redis cart
      security:
        - BearerAuth: []
      description: "Enforces single-restaurant integrity. Rejects addition with 409 Conflict if items from another restaurant are already in cart, unless clearExisting is set to true."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartInput'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '409':
          description: Conflict - Item is from another restaurant

  /cart/items/{itemId}:
    patch:
      summary: Update quantity of a cart item
      security:
        - BearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated cart

    delete:
      summary: Remove a specific item from cart
      security:
        - BearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated cart

  # ==========================================
  # DISPATCH & DRIVER ASSIGNMENT
  # ==========================================
  /drivers/location:
    post:
      summary: Telemetry Ingestion for driver GPS mobile ping
      description: Driver mobile app sends GPS pings every 10–15 seconds. Updates `drivers:available:geo` and sets heartbeat `driver:{driverId}:status`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverId, lat, lng]
              properties:
                driverId: { type: string }
                lat: { type: number, example: 12.9770 }
                lng: { type: number, example: 77.6010 }
                status: { type: string, enum: [ONLINE, BUSY, OFFLINE], default: ONLINE }
      responses:
        '200':
          description: Location registered in Redis
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }

  /dispatch/assign-order/{orderId}:
    post:
      summary: Query Redis for closest available delivery partner and claim atomically
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Driver assigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignedDriverId: { type: string }
                  distanceKm: { type: number }
                  status: { type: string, example: "ASSIGNED" }
        '404':
          description: No drivers available within radius

  # ==========================================
  # ORDERS & LIFECYCLE STATE MACHINE
  # ==========================================
  /orders/checkout:
    post:
      summary: Checkout active shopping cart and initiate order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutInput'
      responses:
        '201':
          description: Order created with 80/20 split breakdown and Razorpay order ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
                  razorpayOrderId: { type: string, example: "order_rzp_1727435000" }
                  keyId: { type: string, example: "rzp_test_key_id" }
        '400':
          description: Cart is empty or invalid checkout payload

  /orders/{orderId}:
    get:
      summary: Fetch order details and split payout by ID
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found

  /orders/{orderId}/status:
    patch:
      summary: Transition order lifecycle status with role-guarded state machine
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusInput'
      responses:
        '200':
          description: Order status updated and broadcasted via WebSocket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid state transition
        '403':
          description: Role not permitted for this transition
        '409':
          description: Terminal state immutable

  /orders/{orderId}/refund:
    post:
      summary: Authorize order refund and dispute reconciliation (ADMIN only)
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundOrderInput'
      responses:
        '200':
          description: Refund processed and ledger updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  refundedAmount: { type: number }
                  status: { type: string, example: "REFUNDED_AND_RECONCILED" }
        '403':
          description: Only ADMIN can authorize refunds

  /orders/{orderId}/reviews:
    post:
      summary: Submit post-delivery dual star ratings for restaurant food and driver
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitReviewInput'
      responses:
        '201':
          description: Dual review recorded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  reviewId: { type: string }
                  message: { type: string }
        '400':
          description: Order not delivered yet
        '409':
          description: Review already submitted

  /orders/{orderId}/tip:
    post:
      summary: Add driver tip top-up (100% disbursed to driver payout)
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTipInput'
      responses:
        '200':
          description: Tip added and driver ledger updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  # ==========================================
  # PAYMENTS & WEBHOOKS
  # ==========================================
  /payments/razorpay-webhook:
    post:
      summary: Webhook for Razorpay payment captures, failures, and automated 80/20 split ledger accounting
      parameters:
        - name: x-razorpay-signature
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Webhook received and validated
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  status: { type: string }
        '403':
          description: Signature verification failed

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        user:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            role: { type: string }

    NearbyRestaurant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        cuisineTypes: { type: array, items: { type: string } }
        rating: { type: number }
        averagePrepTimeMinutes: { type: integer }
        bannerUrl: { type: string }
        distanceKm: { type: number }
        location:
          type: object
          properties:
            lat: { type: number }
            lng: { type: number }

    Cart:
      type: object
      properties:
        restaurantId: { type: string }
        restaurantName: { type: string }
        subtotal: { type: number }
        itemCount: { type: integer }
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'

    CartItem:
      type: object
      properties:
        itemId: { type: string }
        name: { type: string }
        quantity: { type: integer }
        basePrice: { type: number }
        unitPrice: { type: number }
        itemTotal: { type: number }
        selectedOptions:
          type: array
          items:
            type: object
            properties:
              groupName: { type: string }
              choiceName: { type: string }
              additionalPrice: { type: number }

    AddToCartInput:
      type: object
      required: [restaurantId, restaurantName, itemId, name, quantity, basePrice]
      properties:
        restaurantId: { type: string }
        restaurantName: { type: string }
        itemId: { type: string }
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        basePrice: { type: number }
        clearExisting: { type: boolean, default: false }
        selectedOptions:
          type: array
          items:
            type: object
            properties:
              groupName: { type: string }
              choiceName: { type: string }
              additionalPrice: { type: number }

    CheckoutInput:
      type: object
      required: [destinationLat, destinationLng]
      properties:
        deliveryAddress: { type: string, example: "Penthouse 4B, MG Road Boulevard" }
        destinationLat: { type: number, example: 12.9716 }
        destinationLng: { type: number, example: 77.5946 }
        deliveryNotes: { type: string, example: "Ring doorbell twice" }
        driverTip: { type: number, example: 3.00, default: 0 }

    UpdateOrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, ACCEPTED, PREPARING, READY_FOR_PICKUP, OUT_FOR_DELIVERY, DELIVERED, CANCELLED]
        reason: { type: string }

    SubmitReviewInput:
      type: object
      properties:
        foodRating: { type: integer, minimum: 1, maximum: 5, example: 5 }
        driverRating: { type: integer, minimum: 1, maximum: 5, example: 5 }
        foodReview: { type: string, example: "Crust was authentic wood-fired perfection!" }
        driverReview: { type: string, example: "Prompt, warm and courteous!" }
        complimentTags:
          type: array
          items: { type: string }
          example: ["Fast Delivery", "Hot Food", "Great Packaging"]

    AddTipInput:
      type: object
      required: [tipAmount]
      properties:
        tipAmount: { type: number, minimum: 1, example: 5.00 }

    RefundOrderInput:
      type: object
      required: [reason]
      properties:
        amount: { type: number, example: 40.12 }
        reason: { type: string, example: "Missing items or compromised packaging" }

    OrderSplitBreakdown:
      type: object
      properties:
        platformCommission: { type: number, description: "20% Byte Add platform fee" }
        restaurantPayout: { type: number, description: "80% of food subtotal" }
        driverPayout: { type: number, description: "80% of delivery fee + 100% tip" }
        vendorDriverTotalPayout: { type: number, description: "Total 80% vendor/driver payout" }

    Order:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        restaurantId: { type: string }
        restaurantName: { type: string }
        driverId: { type: string }
        status: { type: string, enum: [PENDING, ACCEPTED, PREPARING, READY_FOR_PICKUP, OUT_FOR_DELIVERY, DELIVERED, CANCELLED] }
        items:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string }
              name: { type: string }
              quantity: { type: integer }
              unitPrice: { type: number }
              totalPrice: { type: number }
        subtotal: { type: number }
        taxAmount: { type: number }
        deliveryFee: { type: number }
        driverTip: { type: number }
        totalAmount: { type: number }
        split: { $ref: '#/components/schemas/OrderSplitBreakdown' }
        deliveryAddress: { type: string }
        deliveryNotes: { type: string }
        createdAt: { type: number }
        updatedAt: { type: number }
