<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-container": "#f0edec", "inverse-surface": "#313030", "on-secondary-container": "#663b00", "on-error-container": "#93000a", "on-primary": "#ffffff", "on-surface": "#1c1b1b", "on-primary-fixed-variant": "#930018", "on-secondary-fixed": "#2c1700", "surface-tint": "#bf0022", "inverse-on-surface": "#f3f0ef", "surface-container-highest": "#e5e2e1", "surface-container-low": "#f6f3f2", "on-secondary-fixed-variant": "#683d00", "tertiary-container": "#008379", "on-primary-container": "#fffbff", "surface": "#fcf9f8", "surface-container-lowest": "#ffffff", "primary": "#bb0021", "surface-container-high": "#ebe7e7", "on-primary-fixed": "#410005", "on-tertiary-container": "#f4fffc", "surface-bright": "#fcf9f8", "primary-fixed": "#ffdad7", "surface-dim": "#dcd9d9", "secondary-fixed-dim": "#ffb86b", "outline-variant": "#e8bcb9", "on-error": "#ffffff", "on-surface-variant": "#5e3f3d", "tertiary-fixed-dim": "#4fdbcc", "error-container": "#ffdad6", "tertiary": "#00685f", "on-background": "#1c1b1b", "secondary-container": "#fd9d1a", "on-secondary": "#ffffff", "primary-fixed-dim": "#ffb3af", "surface-variant": "#e5e2e1", "background": "#fcf9f8", "error": "#ba1a1a", "inverse-primary": "#ffb3af", "outline": "#936e6c", "primary-container": "#ea002c", "on-tertiary-fixed": "#00201d", "on-tertiary-fixed-variant": "#005049", "on-tertiary": "#ffffff", "tertiary-fixed": "#70f8e8", "secondary": "#895100", "secondary-fixed": "#ffdcbc" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "margin": "1.25rem", "space-md": "1rem", "space-lg": "1.5rem", "space-xs": "0.25rem", "gutter-sm": "0.75rem", "margin-sm": "1rem", "space-xl": "2rem", "gutter": "1rem", "space-sm": "0.5rem" }, fontFamily: { "body-md": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"] }, fontSize: { "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-xl": ["36px", { "lineHeight": "44px", "fontWeight": "800" }], "headline-lg": ["28px", { "lineHeight": "34px", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }], "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "700" }], "label-md": ["14px", { "lineHeight": "18px", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "700" }], "label-lg": ["16px", { "lineHeight": "20px", "fontWeight": "700" }], "headline-md": ["22px", { "lineHeight": "28px", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }] } } } };</script></head><body class="bg-surface font-body-md text-on-surface antialiased pt-safe pb-safe min-h-screen flex flex-col"><main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full relative overflow-hidden select-none">
<!-- Top Vibrant Crimson Hero Backdrop -->
<div class="relative w-full h-64 overflow-hidden rounded-b-[2.5rem] bg-gradient-to-br from-primary via-primary-container to-surface-tint shadow-lg">
<!-- Atmospheric Food Texture Overlay -->
<div class="absolute inset-0 bg-cover bg-center mix-blend-overlay opacity-30" data-alt="Top down overhead flatlay of sizzling freshly cooked savory gourmet burgers, crispy french fries, dip sauces and rustic bowls of chili with rich warm crimson culinary ambient kitchen lighting, subtle vignette, dynamic energetic mood" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC0BrQJnHogARFj9bM8kAaDNAoFcp1BgVutFfEnA-QmDCEuvl0wqn3yKCODopyLGc7TEqIrrcJkZdyyr8wzCwKaJNB4o6bHRZB8ypNIfl5cxLdq2N-h9e33r4EzY1g1hoMfFA2UX6zgKJTqNEByNPJRagUya7ApaObVkJ1OjyzB85Clx74dQPPY_UUuEeft_tlm6gRuJSyzOMTWn6UrBls0-xEoM0e9g6md71s1_SFoR2KY6nBWxfs')">
</div>
<!-- Floating Visual Accents -->
<div class="absolute -top-10 -right-10 w-44 h-44 rounded-full bg-white/10 blur-2xl pointer-events-none"></div>
<div class="absolute bottom-6 -left-8 w-36 h-36 rounded-full bg-secondary-container/20 blur-xl pointer-events-none"></div>
<!-- Brand Typography Header -->
<div class="relative z-10 flex flex-col items-center justify-center pt-8 px-6 text-center">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/15 backdrop-blur-md mb-2 shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[15px]" style="font-variation-settings: 'FILL' 1;">restaurant</span>
<span class="font-label-sm text-label-sm text-on-primary tracking-widest uppercase">Gourmet Delivery</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-primary font-extrabold tracking-tight drop-shadow-sm flex items-center gap-1">
        FOOD BITES
      </h1>
<p class="font-label-md text-label-md text-on-primary/90 tracking-wider font-semibold uppercase mt-0.5">
        NEVER FEEL HUNGRY
      </p>
</div>
</div>
<!-- Main Floating Authentication Card -->
<div class="relative z-20 -mt-16 mx-4 mb-6">
<div class="w-full bg-surface-container-lowest rounded-xl p-6 sm:p-8 shadow-xl shadow-surface-variant/40 flex flex-col">
<!-- Segmented Pill Auth Switcher -->
<div class="w-full p-1 bg-surface-container rounded-full flex items-center relative mb-6">
<button class="flex-1 py-2.5 rounded-full font-label-md text-label-md text-center transition-all duration-300 shadow-sm bg-primary text-on-primary" id="tab-login-btn" onclick="switchTab('login')" type="button">
          Log In
        </button>
<button class="flex-1 py-2.5 rounded-full font-label-md text-label-md text-center transition-all duration-300 text-on-surface-variant hover:text-on-surface" id="tab-signup-btn" onclick="switchTab('signup')" type="button">
          Sign Up
        </button>
</div>
<!-- Auth Form Container -->
<form class="flex flex-col gap-4" id="auth-form" onsubmit="event.preventDefault();">
<!-- Additional Sign Up Only Field (Hidden by default) -->
<div class="hidden flex-col gap-1.5 transition-all duration-300" id="signup-extra-field">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1 font-semibold">Full Name</label>
<div class="flex items-center px-4 py-3 rounded-DEFAULT bg-surface-container-low transition-all focus-within:bg-surface-container-lowest focus-within:shadow-md">
<span class="material-symbols-outlined text-outline mr-2 text-[20px]">badge</span>
<input class="w-full bg-transparent border-0 outline-none font-body-md text-body-md text-on-surface placeholder:text-outline/70" id="user-name-input" placeholder="e.g. Alex Morgan" type="text"/>
</div>
</div>
<!-- Username / Email Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1 font-semibold">Email or Username</label>
<div class="flex items-center px-4 py-3 rounded-DEFAULT bg-surface-container-low transition-all focus-within:bg-surface-container-lowest focus-within:shadow-md">
<span class="material-symbols-outlined text-outline mr-2 text-[20px]">mail</span>
<input class="w-full bg-transparent border-0 outline-none font-body-md text-body-md text-on-surface placeholder:text-outline/70" id="identity-input" placeholder="alex@foodbites.com" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1 font-semibold">Password</label>
<div class="flex items-center px-4 py-3 rounded-DEFAULT bg-surface-container-low transition-all focus-within:bg-surface-container-lowest focus-within:shadow-md">
<span class="material-symbols-outlined text-outline mr-2 text-[20px]">lock</span>
<input class="w-full bg-transparent border-0 outline-none font-body-md text-body-md text-on-surface placeholder:text-outline/70" id="password-input" placeholder="••••••••••••" required="" type="password"/>
<button class="p-1 rounded-full text-outline hover:text-on-surface transition-colors flex items-center justify-center" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end -mt-1" id="forgot-password-row">
<button class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed-variant transition-colors" type="button">
            Forgot Password?
          </button>
</div>
<!-- Primary Action Button -->
<button class="w-full mt-2 py-3.5 px-6 rounded-full bg-primary text-on-primary font-label-lg text-label-lg shadow-lg shadow-primary/25 active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="submit-auth-btn" type="submit">
<span id="submit-text">Log In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- OR Separator -->
<div class="relative my-6 flex items-center justify-center">
<div class="w-full h-px bg-surface-container-highest"></div>
<span class="absolute bg-surface-container-lowest px-3 font-label-sm text-label-sm text-outline uppercase font-semibold">
          OR
        </span>
</div>
<!-- Quick Social Auth Pill Row -->
<div class="flex items-center justify-center gap-4">
<!-- Google -->
<button aria-label="Continue with Google" class="w-12 h-12 rounded-full bg-surface-container-lowest shadow-md shadow-surface-variant/30 flex items-center justify-center active:scale-95 transition-transform hover:bg-surface-container-low" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
</button>
<!-- Facebook -->
<button aria-label="Continue with Facebook" class="w-12 h-12 rounded-full bg-[#1877F2] text-white shadow-md shadow-[#1877F2]/25 flex items-center justify-center active:scale-95 transition-transform hover:opacity-90" type="button">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
</button>
<!-- Twitter / X -->
<button aria-label="Continue with X" class="w-12 h-12 rounded-full bg-[#1DA1F2] text-white shadow-md shadow-[#1DA1F2]/25 flex items-center justify-center active:scale-95 transition-transform hover:opacity-90" type="button">
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
</svg>
</button>
</div>
</div>
</div>
<!-- Bottom Visual Culinary Anchor Strip -->
<div class="relative w-full h-44 mt-auto overflow-hidden">
<!-- Appetizing Burgers & Golden Fries Graphic Display -->
<div class="w-full h-full bg-cover bg-bottom opacity-95 transition-transform duration-700 hover:scale-105" data-alt="Appetizing double cheeseburgers stacked with fresh crispy lettuce, melted cheddar cheese, ripe tomatoes, surrounded by abundant pile of golden crunchy french fries and ketchup sauce cups against a warm neutral clean studio backdrop, appetizing commercial food photography" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAPzgUweDNNXTPPSgHlsqeHzl57uc12APm7Pp7oNq6SaXRe6Z5oSF46dweKdn186L1aNMuPHQGRScbSrj3uiq8ijt8xvlDBOeoBGy0YAV5ZEiWvR7Gx8qCCKkMz7ktrgFAx9MmKY3GRU-RgtTJN41a4u5Lo6NGPOvKR6F584Tt4n_iTf6z2ngRIyLDVtId5QQFTH8sktNXfMRGdw5Wp3Vsd3IuxGOGlSqrUNlQco5XypCuUEAsITdM')">
</div>
<!-- Soft top blending gradient into surface -->
<div class="absolute inset-0 bg-gradient-to-t from-transparent via-surface/40 to-surface pointer-events-none"></div>
</div>
</div>
<script>
  let activeAuthMode = 'login';

  function switchTab(mode) {
    activeAuthMode = mode;
    const loginBtn = document.getElementById('tab-login-btn');
    const signupBtn = document.getElementById('tab-signup-btn');
    const signupField = document.getElementById('signup-extra-field');
    const forgotRow = document.getElementById('forgot-password-row');
    const submitText = document.getElementById('submit-text');

    if (mode === 'login') {
      loginBtn.className = 'flex-1 py-2.5 rounded-full font-label-md text-label-md text-center transition-all duration-300 shadow-sm bg-primary text-on-primary';
      signupBtn.className = 'flex-1 py-2.5 rounded-full font-label-md text-label-md text-center transition-all duration-300 text-on-surface-variant hover:text-on-surface';
      signupField.classList.add('hidden');
      forgotRow.classList.remove('hidden');
      submitText.textContent = 'Log In';
    } else {
      signupBtn.className = 'flex-1 py-2.5 rounded-full font-label-md text-label-md text-center transition-all duration-300 shadow-sm bg-primary text-on-primary';
      loginBtn.className = 'flex-1 py-2.5 rounded-full font-label-md text-label-md text-center transition-all duration-300 text-on-surface-variant hover:text-on-surface';
      signupField.classList.remove('hidden');
      forgotRow.classList.add('hidden');
      submitText.textContent = 'Create Account';
    }
  }

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password-input');
    const icon = document.getElementById('password-toggle-icon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      icon.textContent = 'visibility';
    }
  }
</script></main></body></html>
