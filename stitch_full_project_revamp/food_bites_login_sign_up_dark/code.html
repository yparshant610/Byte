<script>
  let activeAuthMode = 'login';

  function switchTab(mode) {
    activeAuthMode = mode;
    const loginBtn = document.getElementById('tab-login-btn');
    const signupBtn = document.getElementById('tab-signup-btn');
    const signupField = document.getElementById('signup-extra-field');
    const forgotRow = document.getElementById('forgot-password-row');
    const submitText = document.getElementById('submit-text');

    if (mode === 'login') {
      loginBtn.className = 'flex-1 py-2.5 rounded-full font-label-md text-label-md text-center transition-all duration-300 shadow-md bg-[#ff1e38] text-white font-semibold';
      signupBtn.className = 'flex-1 py-2.5 rounded-full font-label-md text-label-md text-center transition-all duration-300 text-on-surface-variant hover:text-white';
      signupField.classList.add('hidden');
      forgotRow.classList.remove('hidden');
      submitText.textContent = 'Log In';
    } else {
      signupBtn.className = 'flex-1 py-2.5 rounded-full font-label-md text-label-md text-center transition-all duration-300 shadow-md bg-[#ff1e38] text-white font-semibold';
      loginBtn.className = 'flex-1 py-2.5 rounded-full font-label-md text-label-md text-center transition-all duration-300 text-on-surface-variant hover:text-white';
      signupField.classList.remove('hidden');
      forgotRow.classList.add('hidden');
      submitText.textContent = 'Create Account';
    }
  }

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password-input');
    const icon = document.getElementById('password-toggle-icon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      icon.textContent = 'visibility';
    }
  }
</script></main></body></html>
