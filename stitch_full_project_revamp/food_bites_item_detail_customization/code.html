<span class="material-symbols-outlined text-[20px]">remove</span>
</button>

</button>

<script>
  let basePrice = 10.99;
  let crustPrice = 0.00;
  let toppingsTotal = 0.00;
  let quantity = 1;

  function recalculate() {
    const singleItemTotal = basePrice + crustPrice + toppingsTotal;
    const finalTotal = singleItemTotal * quantity;
    document.getElementById('unit-price-display').innerText = '$' + singleItemTotal.toFixed(2);
    document.getElementById('total-price-badge').innerText = '$' + finalTotal.toFixed(2);
  }

  function selectSize(element, price) {
    document.querySelectorAll('.size-option').forEach(btn => {
      btn.classList.add('opacity-80');
      const ind = btn.querySelector('.selection-indicator');
      ind.className = 'selection-indicator w-4 h-4 rounded-full bg-surface-container-highest flex items-center justify-center';
      ind.firstElementChild.className = 'w-1.5 h-1.5 rounded-full bg-transparent';
    });
    element.classList.remove('opacity-80');
    const activeInd = element.querySelector('.selection-indicator');
    activeInd.className = 'selection-indicator w-4 h-4 rounded-full bg-primary flex items-center justify-center';
    activeInd.firstElementChild.className = 'w-1.5 h-1.5 rounded-full bg-on-primary';
    basePrice = price;
    recalculate();
  }

  function selectCrust(element, price) {
    document.querySelectorAll('.crust-option').forEach(opt => {
      opt.classList.add('opacity-80');
      const radio = opt.querySelector('.crust-radio');
      radio.className = 'crust-radio w-5 h-5 rounded-full bg-surface-container-highest flex items-center justify-center';
      radio.firstElementChild.className = 'w-2 h-2 rounded-full bg-transparent';
    });
    element.classList.remove('opacity-80');
    const activeRadio = element.querySelector('.crust-radio');
    activeRadio.className = 'crust-radio w-5 h-5 rounded-full bg-primary flex items-center justify-center text-on-primary';
    activeRadio.firstElementChild.className = 'w-2 h-2 rounded-full bg-on-primary';
    crustPrice = price;
    recalculate();
  }

  function toggleTopping(btn) {
    const p = parseFloat(btn.getAttribute('data-price'));
    const isSelected = btn.classList.contains('bg-primary');
    const icon = btn.querySelector('.material-symbols-outlined');
    
    if (isSelected) {
      btn.classList.remove('bg-primary', 'text-on-primary');
      btn.classList.add('bg-surface-container-low', 'text-on-surface');
      icon.innerText = 'add';
      icon.classList.remove('text-on-primary');
      icon.classList.add('text-on-surface-variant');
      toppingsTotal -= p;
    } else {
      btn.classList.remove('bg-surface-container-low', 'text-on-surface');
      btn.classList.add('bg-primary', 'text-on-primary');
      icon.innerText = 'check';
      icon.classList.remove('text-on-surface-variant');
      icon.classList.add('text-on-primary');
      toppingsTotal += p;
    }
    recalculate();
  }

  function updateQty(change) {
    quantity = Math.max(1, quantity + change);
    document.getElementById('qty-counter').innerText = quantity;
    recalculate();
  }

  function animateAddToCart(btn) {
    btn.classList.add('scale-95');
    const prevHTML = btn.innerHTML;
    btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[22px] mx-auto">progress_activity</span>`;
    setTimeout(() => {
      btn.innerHTML = `<div class="flex items-center justify-center gap-2 w-full text-center"><span class="material-symbols-outlined text-[22px]">check_circle</span> Added to Cart!</div>`;
      setTimeout(() => {
        btn.classList.remove('scale-95');
        btn.innerHTML = prevHTML;
      }, 1200);
    }, 400);
  }
</script></main></body></html>
